# Render Blueprint: one web service plus one Postgres database.
# Dashboard: New > Blueprint > pick this repo. No other setup needed.
services:
  - type: web
    name: provenance
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: provenance-db, property: connectionString }
      - key: AUTO_SEED
        value: "1"
      - key: PORT
        value: "10000"
databases:
  - name: provenance-db
    plan: free
