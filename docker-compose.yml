services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: koah
      POSTGRES_PASSWORD: koah
      POSTGRES_DB: koah_attribution
    ports:
      - "55432:5432" # uncommon host port so it doesn't clash with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koah"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
