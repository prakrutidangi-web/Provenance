    <!-- Koah-style conversion pixel. The stub queues kad() calls until /pixel.js loads (async, non-blocking). -->
    <script>
      !(function (w, d) {
        if (!w.kad) {
          var p = (w.kad = function () {
            p.sendEvent ? p.sendEvent.apply(p, arguments) : p.queue.push(arguments);
          });
          p.queue = [];
          var t = d.createElement("script");
          t.src = "/pixel.js";
          t.async = !0;
          var s = d.getElementsByTagName("script")[0];
          s.parentNode.insertBefore(t, s);
        }
      })(window, document);
      // spa: also track client-side route changes. ignorePaths: internal pages and the demo publisher (/chat) are not store traffic.
      kad("init", "adv_kernelcraft", { spa: true, ignorePaths: ["/admin", "/chat"] });
      kad("track", "PageView");
    </script>
  </head>

    <noscript><img height="1" width="1" style="display: none" src="/kad/e?id=adv_kernelcraft&ev=PageView&noscript=1" /></noscript>
